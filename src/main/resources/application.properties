spring.application.name=FinCore Risk & Credit Origination Engine
# Cloud Run injects PORT env var; defaults to 8080 for Cloud Shell / local execution
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:fincoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
